<!DOCTYPE html><html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTFOOTBALL | انتخاب تیم لیگ ایران</title>
  <style>
    body{font-family:Tahoma,sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);margin:0;color:#fff;text-align:center}
    header{padding:20px;font-size:26px;font-weight:bold;background:rgba(0,0,0,.4)}
    .logo{font-size:32px;margin-bottom:10px}
    .container{max-width:560px;margin:25px auto;background:#fff;color:#000;padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.35)}
    input,select,button{width:90%;padding:12px;margin:8px 0;font-size:16px}
    button{background:#007bff;color:#fff;border:none;border-radius:6px;cursor:pointer}
    button.admin{background:#dc3545}
    button.gray{background:#6c757d}
    button.green{background:#28a745}
    button.orange{background:#fd7e14}
    button:hover{opacity:.9}
    .team-list{max-width:700px;margin:20px auto}
    .team{background:#fff;color:#000;padding:12px;margin:10px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.3)}
    .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
    .hidden{display:none}
    footer{background:rgba(0,0,0,.4);padding:15px;font-size:14px}
    footer span{color:#00ffcc}
    small.badge{display:inline-block;padding:4px 8px;border-radius:10px;background:#eee;margin-right:6px}
  </style>
</head>
<body>
<header>
  <div class="logo">⚽ MTFOOTBALL</div>
  سامانه رسمی انتخاب تیم لیگ ایران
</header><!-- ورود مربی --><div class="container" id="coachPage">
  <h3>👤 ورود مربی</h3>
  <input type="text" id="coachName" placeholder="نام مربی">
  <button onclick="goToTeamSelect()">ادامه</button>
</div><!-- انتخاب تیم --><div class="container hidden" id="teamPage">
  <h3 id="welcome"></h3>
  <select id="teamSelect"></select>
  <button onclick="chooseTeam()">انتخاب تیم</button>
</div><!-- پنل ادمین --><div class="container" id="adminPage">
  <h3>🔐 پنل ادمین</h3>
  <input type="password" id="adminPass" placeholder="رمز ادمین">
  <button class="admin" onclick="adminLogin()">ورود ادمین</button>
  <div id="adminPanel" class="hidden"></div>
</div><div class="team-list" id="chosenList"></div><footer>
  📞 پشتیبانی در روبیکا:<br>
  <span>@MTFOOTBALL11</span> | <span>@Parsa199891</span><br><br>
  📢 کانال رسمی روبیکا:<br>
  <span>@MTFOOTBALL1</span>
</footer><script>
  const ADMIN_PASSWORD='mtfootball-admin';
  const iranLeagueTeams=['پرسپولیس','استقلال','سپاهان','تراکتور','فولاد','ذوب‌آهن','گل‌گهر','آلومینیوم','ملوان','نساجی','پیکان','هوادار','استقلال خوزستان','صنعت نفت','مس رفسنجان','شمس‌آذر'];

  // chosen[team] = { by:'coach/admin', label:'...', coachName?:'' }
  let chosen=JSON.parse(localStorage.getItem('mtfootball_chosen'))||{};
  let currentCoach='';

  const save=()=>localStorage.setItem('mtfootball_chosen',JSON.stringify(chosen));

  function goToTeamSelect(){
    const name=coachName.value.trim(); if(!name) return alert('نام مربی را وارد کن');
    currentCoach=name; welcome.innerText=سلام ${name} 👋 تیم خودتو انتخاب کن;
    coachPage.classList.add('hidden'); teamPage.classList.remove('hidden'); renderSelect();
  }

  function renderSelect(){
    teamSelect.innerHTML='<option value="">انتخاب تیم</option>';
    iranLeagueTeams.forEach(t=>{ if(!chosen[t]){ const o=document.createElement('option'); o.value=t; o.textContent=t; teamSelect.appendChild(o);} });
  }

  function renderList(){
    chosenList.innerHTML='';
    Object.keys(chosen).forEach(team=>{
      const v=chosen[team];
      const div=document.createElement('div'); div.className='team';
      let badge = v.by==='coach' ? '<small class="badge">انتخاب مربی</small>' : '<small class="badge">ادمین</small>';
      div.innerHTML=${badge}<b>${team}</b> ➜ ${v.label}${v.coachName? ' | مربی: '+v.coachName:''};
      chosenList.appendChild(div);
    });
  }function chooseTeam(){
    if(!teamSelect.value) return alert('یک تیم انتخاب کن');
    chosen[teamSelect.value]={by:'coach',label:'قفل شده توسط مربی',coachName:currentCoach};
    save(); renderSelect(); renderList(); teamPage.classList.add('hidden'); coachPage.classList.remove('hidden'); coachName.value='';
  }

  function adminLogin(){
    if(adminPass.value!==ADMIN_PASSWORD) return alert('رمز اشتباه است');
    adminPanel.classList.remove('hidden'); adminPanel.innerHTML='<h4>مدیریت تیم‌ها</h4>';
    iranLeagueTeams.forEach(t=>{
      const wrap=document.createElement('div'); wrap.className='team';
      const state=chosen[t];
      const title=document.createElement('div'); title.innerHTML=<b>${t}</b>; wrap.appendChild(title);
      const row=document.createElement('div'); row.className='row';
      if(!state){
        const lockBtn=btn('قفل (ادمین)','admin',()=>setAdminState(t,'قفل شده توسط ادمین'));
        row.appendChild(lockBtn);
      } else if(state.by==='coach'){
        const asPlayer=btn('مثل بازیکن قفل','orange',()=>setCoachLike(t));
        const reserve=btn('رزرو شده','gray',()=>setAdminState(t,'رزرو شده'));
        const unlock=btn('آزاد','green',()=>unlockTeam(t));
        row.append(asPlayer,reserve,unlock);
      } else { // admin
        const reserve=btn('رزرو شده','gray',()=>setAdminState(t,'رزرو شده'));
        const adminLock=btn('قفل ادمین','admin',()=>setAdminState(t,'قفل شده توسط ادمین'));
        const coachLike=btn('مثل بازیکن قفل','orange',()=>setCoachLike(t));
        const unlock=btn('آزاد','green',()=>unlockTeam(t));
        row.append(reserve,adminLock,coachLike,unlock);
      }
      wrap.appendChild(row); adminPanel.appendChild(wrap);
    });
  }

  function btn(text,cls,fn){ const b=document.createElement('button'); b.textContent=text; b.className=cls; b.onclick=fn; return b; }

  // Admin states
  function setAdminState(team,label){ chosen[team]={by:'admin',label}; save(); renderSelect(); renderList(); adminLogin(); }
  function setCoachLike(team){ chosen[team]={by:'coach',label:'قفل شده توسط مربی'}; save(); renderSelect(); renderList(); adminLogin(); }
  function unlockTeam(team){ delete chosen[team]; save(); renderSelect(); renderList(); adminLogin(); }

  renderList();
</script></body>
</html>
