<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تیم‌های لیگ ایران | MTFOOTBALL</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="blockOverlay" class="block-overlay hidden" aria-hidden="true">
    <div class="block-box">
      <h2>دسترسی مسدود است</h2>
      <p>متاسفانه دسترسی از کشور شما به این سایت مجاز نیست.</p>
      <div class="block-actions">
        <input id="adminOverridePass" type="password" placeholder="رمز ادمین برای ورود">
        <button id="adminOverrideBtn" class="btn primary">ورود ادمین</button>
      </div>
      <p class="small-note">اگر ادمین هستید، رمز را وارد کنید تا دسترسی پیدا کنید.</p>
    </div>
  </div>

  <header class="site-header">
    <div class="logo">⚽ MTFOOTBALL</div>
    <h1 id="leagueTitle">تیم‌های لیگ ایران</h1>
    <button id="openAdminBtn" class="btn ghost admin-toggle">پنل ادمین</button>
  </header>

  <main class="container">
    <section id="teamsGrid" class="teams-grid" aria-live="polite"></section>
  </main>

  <!-- Modal: ثبت نام / ورود -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content">
      <button id="modalClose" class="modal-close" title="بستن">✕</button>

      <div id="modalStepChoice" class="modal-step">
        <h3>برای رزرو تیم انتخاب کن</h3>
        <p id="modalTeamName" class="modal-team"></p>
        <div class="modal-actions">
          <button id="toRegisterBtn" class="btn primary">ثبت‌نام مربی</button>
          <button id="toLoginBtn" class="btn">ورود مربی</button>
        </div>
      </div>

      <div id="modalRegister" class="modal-step hidden">
        <h3>ثبت‌نام مربی</h3>
        <input id="reg_username" placeholder="نام کاربری (مثلا: ali)" autocomplete="username">
        <input id="reg_password" type="password" placeholder="رمز عبور" autocomplete="new-password">
        <div class="modal-actions">
          <button id="doRegister" class="btn primary">ثبت‌نام و رزرو</button>
          <button id="backFromRegister" class="btn">بازگشت</button>
        </div>
        <p class="note">اگر قبلاً ثبت‌نام کردی از بخش ورود استفاده کن.</p>
      </div>

      <div id="modalLogin" class="modal-step hidden">
        <h3>ورود مربی</h3>
        <input id="login_username" placeholder="نام کاربری" autocomplete="username">
        <input id="login_password" type="password" placeholder="رمز عبور" autocomplete="current-password">
        <div class="modal-actions">
          <button id="doLogin" class="btn primary">ورود و رزرو</button>
          <button id="backFromLogin" class="btn">بازگشت</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Admin panel (گرافیکی، slide-in) -->
  <aside id="adminPanel" class="admin-panel hidden" aria-hidden="true">
    <div class="admin-header">
      <h3>پنل ادمین</h3>
      <button id="closeAdmin" class="btn ghost">بستن</button>
    </div>

    <div class="admin-body">
      <div class="admin-section">
        <label>رمز ادمین</label>
        <input id="adminPassInput" type="password" placeholder="رمز ادمین">
        <button id="adminLoginBtn" class="btn primary">ورود</button>
      </div>

      <div id="adminTools" class="admin-tools hidden">
        <div class="admin-section">
          <label>نام لیگ</label>
          <input id="leagueNameInput" type="text">
          <button id="saveLeagueName" class="btn">ذخیره نام لیگ</button>
        </div>

        <div class="admin-section">
          <label>ویرایش نام تیم‌ها</label>
          <div id="teamsEditList" class="teams-edit-list"></div>
          <button id="saveTeamNames" class="btn">ذخیره اسامی تیم‌ها</button>
          <button id="resetTeams" class="btn ghost">بازیابی پیش‌فرض</button>
        </div>

        <div class="admin-section">
          <label>عملیات مدیریتی</label>
          <button id="unlockAll" class="btn">آزادسازی همه تیم‌ها</button>
          <button id="exportData" class="btn">خروجی JSON</button>
        </div>
      </div>

    </div>
  </aside>

  <footer class="site-footer">حق نشر © MTFOTBALL</footer>

  <script src="app.js"></script>
</body>
</html>
