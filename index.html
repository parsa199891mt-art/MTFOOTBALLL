<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>MTFOOTBALL</title>
<style>
body{font-family:tahoma;background:#0f2027;color:#fff;text-align:center}
.container{background:#fff;color:#000;max-width:500px;margin:20px auto;padding:20px;border-radius:12px}
button{padding:10px;width:90%;margin:5px;font-size:16px;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>

<div class="container" id="authPage">
  <h3>👤 مربیان</h3>
  <button onclick="showRegister()">ثبت‌نام مربی</button>
  <button onclick="showLogin()">ورود مربی</button>
</div>

<div class="container hidden" id="registerPage">
  <h3>📝 ثبت‌نام مربی</h3>
  <input id="regName" placeholder="نام مربی"><br>
  <input id="regPass" type="password" placeholder="رمز عبور"><br>
  <button onclick="registerCoach()">ثبت‌نام</button>
</div>

<div class="container hidden" id="loginPage">
  <h3>🔑 ورود مربی</h3>
  <input id="loginName" placeholder="نام مربی"><br>
  <input id="loginPass" type="password" placeholder="رمز عبور"><br>
  <button onclick="loginCoach()">ورود</button>
</div>

<div class="container hidden" id="teamPage">
  <h3 id="welcome"></h3>
  <select id="teamSelect"></select><br>
  <button onclick="chooseTeam()">انتخاب تیم</button>
</div>

<script>
const teams=['پرسپولیس','استقلال','سپاهان','تراکتور'];
let coaches=JSON.parse(localStorage.getItem('coaches'))||{};
let chosen=JSON.parse(localStorage.getItem('chosen'))||{};
let currentCoach='';

function save(){
 localStorage.setItem('coaches',JSON.stringify(coaches));
 localStorage.setItem('chosen',JSON.stringify(chosen));
}

function showRegister(){
 authPage.classList.add('hidden');
 registerPage.classList.remove('hidden');
}

function showLogin(){
 authPage.classList.add('hidden');
 loginPage.classList.remove('hidden');
}

function registerCoach(){
 const n=regName.value.trim();
 const p=regPass.value.trim();
 if(!n||!p) return alert('همه فیلدها پر شود');
 if(coaches[n]) return alert('این مربی قبلا ثبت شده');
 coaches[n]=p;
 save();
 alert('ثبت‌نام موفق');
 registerPage.classList.add('hidden');
 authPage.classList.remove('hidden');
}

function loginCoach(){
 const n=loginName.value.trim();
 const p=loginPass.value.trim();
 if(coaches[n]!==p) return alert('نام یا رمز اشتباه');
 currentCoach=n;
 welcome.innerText=`سلام ${n} 👋 تیم خودتو انتخاب کن`;
 loginPage.classList.add('hidden');
 teamPage.classList.remove('hidden');
 renderTeams();
}

function renderTeams(){
 teamSelect.innerHTML='<option value="">انتخاب تیم</option>';
 teams.forEach(t=>{
  if(!chosen[t]){
   let o=document.createElement('option');
   o.value=t; o.textContent=t;
   teamSelect.appendChild(o);
  }
 });
}

function chooseTeam(){
 if(!teamSelect.value) return alert('تیم انتخاب کن');
 chosen[teamSelect.value]=currentCoach;
 save();
 alert('تیم ثبت شد');
 teamPage.classList.add('hidden');
 authPage.classList.remove('hidden');
}
</script>

</body>
</html>
