<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTFOOTBALL | انتخاب تیم لیگ ایران</title>
<style>
body{font-family:Tahoma;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);margin:0;color:#fff;text-align:center;direction:rtl}
header{padding:20px;font-size:26px;font-weight:bold;background:rgba(0,0,0,.4)}
.container{max-width:560px;margin:25px auto;background:#fff;color:#000;padding:20px;border-radius:14px;box-shadow: 0 10px 20px rgba(0,0,0,0.3)}
input,select,button{width:90%;padding:12px;margin:8px 0;font-size:16px;border-radius:6px;border:1px solid #ccc;font-family:Tahoma}
button{background:#007bff;color:#fff;border:none;cursor:pointer;transition: 0.3s}
button:hover{opacity: 0.8}
button.admin{background:#dc3545}
button.gray{background:#6c757d}
button.green{background:#28a745}
.hidden{display:none}
.team{background:#f9f9f9;color:#333;padding:12px;margin:10px;border-radius:10px;border-right: 5px solid #007bff;text-align:right}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
footer{background:rgba(0,0,0,.4);padding:15px;font-size:14px;margin-top:30px}
#chosenList {max-width:560px; margin: 0 auto;}
</style>
</head>
<body>

<header>⚽ MTFOOTBALL</header>

<div class="container" id="authPage">
  <h2>خوش آمدید</h2>
  <button onclick="showRegister()">ثبت نام مربی جدید</button>
  <button onclick="showLogin()">ورود مربی</button>
  <button class="admin" onclick="showAdmin()">ورود ادمین</button>
</div>

<div class="container hidden" id="registerPage">
  <h3>ثبت‌نام مربی</h3>
  <input id="regName" placeholder="نام مربی">
  <input id="regPass" type="password" placeholder="رمز عبور">
  <button onclick="registerCoach()">ثبت نام</button>
  <button class="gray" onclick="showAuth()">بازگشت</button>
</div>

<div class="container hidden" id="loginPage">
  <h3>ورود به سیستم</h3>
  <input id="loginName" placeholder="نام مربی">
  <input id="loginPass" type="password" placeholder="رمز عبور">
  <button onclick="loginCoach()">ورود</button>
  <button class="gray" onclick="showAuth()">بازگشت</button>
</div>

<div class="container hidden" id="teamPage">
  <h3 id="welcome"></h3>
  <select id="teamSelect"></select>
  <button class="green" onclick="chooseTeam()">ثبت نهایی تیم</button>
  <button class="gray" onclick="location.reload()">خروج</button>
</div>

<div class="container hidden" id="adminPage">
  <div id="adminAuth">
    <input type="password" id="adminPass" placeholder="رمز عبور ادمین">
    <button class="admin" onclick="adminLogin()">ورود ادمین</button>
    <button class="gray" onclick="showAuth()">بازگشت</button>
  </div>
  <div id="adminPanel" class="hidden"></div>
</div>

<div id="chosenList"></div>

<footer>حق نشر © MTFOOTBALL | 2026</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// 🔴 اطلاعات فایربیس خودت رو اینجا بزار
const firebaseConfig = {
  apiKey: "AIza...", 
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASSWORD = 'mtfootball-admin';
const iranLeagueTeams = [
  'پرسپولیس','استقلال','سپاهان','تراکتور','فولاد','ذوب‌آهن','گل‌گهر',
  'آلومینیوم','ملوان','نساجی','پیکان','هوادار',
  'استقلال خوزستان','صنعت نفت','مس رفسنجان','شمس‌آذر'
];

let chosen = {};
let currentCoach = '';

// مدیریت صفحات
const getEl = id => document.getElementById(id);
window.showAuth = () => { hideAll(); getEl('authPage').classList.remove('hidden'); }
window.showRegister = () => { hideAll(); getEl('registerPage').classList.remove('hidden'); }
window.showLogin = () => { hideAll(); getEl('loginPage').classList.remove('hidden'); }
window.showAdmin = () => { hideAll(); getEl('adminPage').classList.remove('hidden'); }
function hideAll() {
    ['authPage', 'registerPage', 'loginPage', 'teamPage', 'adminPage'].forEach(p => getEl(p).classList.add('hidden'));
}

// عملیات ثبت‌نام (ذخیره در Firestore)
window.registerCoach = async () => {
    const n = getEl('regName').value.trim(), p = getEl('regPass').value.trim();
    if(!n || !p) return alert('نام و رمز را وارد کنید');
    const ref = doc(db, "coaches", n);
    const snap = await getDoc(ref);
    if(snap.exists()) return alert('این نام مربی قبلاً ثبت شده');
    await setDoc(ref, {password: p});
    alert('ثبت نام موفق! حالا وارد شوید');
    showLogin();
};

// عملیات ورود
window.loginCoach = async () => {
    const n = getEl('loginName').value.trim(), p = getEl('loginPass').value.trim();
    const snap = await getDoc(doc(db, "coaches", n));
    if(snap.exists() && snap.data().password === p) {
        currentCoach = n;
        getEl('welcome').innerText = سلام مربی ${n} 👋;
        hideAll(); getEl('teamPage').classList.remove('hidden');
        renderSelect();
    } else {
        alert('نام یا رمز اشتباه است');
    }
};

// انتخاب تیم
window.chooseTeam = async () => {
    const team = getEl('teamSelect').value;
    if(!team) return alert('تیمی انتخاب نکردید');
    if(chosen[team]) return alert('این تیم رزرو شده است');
    
    await setDoc(doc(db, "teams", team), {
        coach: currentCoach,
        type: 'coach',
        time: new Date().toLocaleTimeString('fa-IR')
    });
    alert('تیم با موفقیت رزرو شد');
    location.reload();
};

// رندر کردن لیست انتخابی
function renderSelect() {
    const select = getEl('teamSelect');
    select.innerHTML = '<option value="">-- انتخاب تیم --</option>';
    iranLeagueTeams.forEach(t => {
        if(!chosen[t]) {
            const opt = document.createElement('option');
            opt.value = opt.text = t;
            select.appendChild(opt);
        }
    });
}

// مدیریت ادمین
window.adminLogin = () => {
    if(getEl('adminPass').value === ADMIN_PASSWORD) {
        getEl('adminAuth').classList.add('hidden');
        getEl('adminPanel').classList.remove('hidden');
        renderAdminPanel();
    } else alert('رمز ادمین غلط است');
};

function renderAdminPanel() {
    const panel = getEl('adminPanel');
    panel.innerHTML = '<h3>مدیریت تیم‌ها</h3>';
    iranLeagueTeams.forEach(t => {
        const div = document.createElement('div');
        div.className = 'team';
        div.innerHTML = <b>${t}</b> ${chosen[t] ? '(رزرو)' : '(آزاد)'};
        const btn = document.createElement('button');
        btn.innerText = 'آزاد سازی';
        btn.className = 'admin';
        btn.style.width = 'auto'; btn.style.marginRight = '10px';
        btn.onclick = async () => await deleteDoc(doc(db, "teams", t));
        div.appendChild(btn);
        panel.appendChild(div);
    });
}

// آپدیت لحظه‌ای لیست
onSnapshot(collection(db, "teams"), snap => {
    chosen = {};
    snap.forEach(d => chosen[d.id] = d.data());
    
    const list = getEl('chosenList');
    list.innerHTML = '<h3 style="color:#fff">وضعیت لحظه‌ای تیم‌ها</h3>';
    Object.keys(chosen).forEach(team => {
        const info = chosen[team];
        const div = document.createElement('div');
        div.className = 'team';
        div.innerHTML = ⚽ <b>${team}</b> ➜ مربی: ${info.coach  'نامشخص'} <br> <small>ساعت ثبت: ${info.time  ''}</small>;
        list.appendChild(div);
    });
    renderSelect();
    if(!getEl('adminPanel').classList.contains('hidden')) renderAdminPanel();
});
</script>
</body>
</html>
