<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTFOOTBALL | انتخاب تیم لیگ ایران</title>
<style>
body{font-family:Tahoma;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);margin:0;color:#fff;text-align:center}
header{padding:20px;font-size:26px;font-weight:bold;background:rgba(0,0,0,.4)}
.container{max-width:560px;margin:25px auto;background:#fff;color:#000;padding:20px;border-radius:14px}
input,select,button{width:90%;padding:12px;margin:8px 0;font-size:16px}
button{background:#007bff;color:#fff;border:none;border-radius:6px;cursor:pointer}
button.admin{background:#dc3545}
button.gray{background:#6c757d}
button.green{background:#28a745}
button.orange{background:#fd7e14}
.hidden{display:none}
.team{background:#fff;color:#000;padding:12px;margin:10px;border-radius:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
small.badge{padding:4px 8px;border-radius:10px;background:#eee}
footer{background:rgba(0,0,0,.4);padding:15px;font-size:14px;margin-top:30px}
</style>
</head>
<body>

<header>⚽ MTFOOTBALL</header>

<div class="container" id="authPage">
  <button onclick="showRegister()">ثبت نام مربی</button>
  <button onclick="showLogin()">ورود مربی</button>
  <button class="admin" onclick="showAdmin()">ورود ادمین</button>
</div>

<div class="container hidden" id="registerPage">
  <input id="regName" placeholder="نام مربی">
  <input id="regPass" type="password" placeholder="رمز">
  <button onclick="registerCoach()">ثبت نام</button>
</div>

<div class="container hidden" id="loginPage">
  <input id="loginName" placeholder="نام مربی">
  <input id="loginPass" type="password" placeholder="رمز">
  <button onclick="loginCoach()">ورود</button>
</div>

<div class="container hidden" id="teamPage">
  <h3 id="welcome"></h3>
  <select id="teamSelect"></select>
  <button onclick="chooseTeam()">انتخاب تیم</button>
</div>

<div class="container hidden" id="adminPage">
  <input type="password" id="adminPass" placeholder="رمز ادمین">
  <button class="admin" onclick="adminLogin()">ورود ادمین</button>
  <div id="adminPanel" class="hidden"></div>
</div>

<div id="chosenList"></div>

<footer>حق نشر © MTFOOTBALL</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

/* 🔴 جایگزین با Firebase خودت */
const firebaseConfig = {
  apiKey: "AIzaSyCCZN4hqj8wjPmF4xWucmXjET8LS1uagOQ",
  authDomain: "mtfootball-71035.firebaseapp.com",
  projectId: "mtfootball-71035"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PASSWORD = 'mtfootball-admin';
const iranLeagueTeams = [
  'پرسپولیس','استقلال','سپاهان','تراکتور','فولاد','ذوب‌آهن','گل‌گهر',
  'آلومینیوم','ملوان','نساجی','پیکان','هوادار',
  'استقلال خوزستان','صنعت نفت','مس رفسنجان','شمس‌آذر'
];

let coaches = JSON.parse(localStorage.getItem('coaches')) || {};
let chosen = {};
let currentCoach = '';

// گرفتن المان‌ها
const authPage = document.getElementById('authPage');
const registerPage = document.getElementById('registerPage');
const loginPage = document.getElementById('loginPage');
const teamPage = document.getElementById('teamPage');
const adminPage = document.getElementById('adminPage');
const welcome = document.getElementById('welcome');
const teamSelect = document.getElementById('teamSelect');
const adminPanel = document.getElementById('adminPanel');
const chosenList = document.getElementById('chosenList');
const regName = document.getElementById('regName');
const regPass = document.getElementById('regPass');
const loginName = document.getElementById('loginName');
const loginPass = document.getElementById('loginPass');
const adminPass = document.getElementById('adminPass');

window.hideAll = () => {
  authPage.classList.add('hidden');
  registerPage.classList.add('hidden');
  loginPage.classList.add('hidden');
  teamPage.classList.add('hidden');
  adminPage.classList.add('hidden');
}

window.showRegister = () => { hideAll(); registerPage.classList.remove('hidden'); }
window.showLogin = () => { hideAll(); loginPage.classList.remove('hidden'); }
window.showAdmin = () => { hideAll(); adminPage.classList.remove('hidden'); }

window.registerCoach = () => {
  const n = regName.value.trim(), p = regPass.value.trim();
  if(!n || !p) return alert('اطلاعات ناقص');
  if(coaches[n]) return alert('قبلا ثبت شده');
  coaches[n] = p; 
  localStorage.setItem('coaches', JSON.stringify(coaches));
  hideAll(); authPage.classList.remove('hidden');
}

window.loginCoach = () => {
  const n = loginName.value.trim(), p = loginPass.value.trim();
  if(coaches[n] !== p) return alert('اشتباه');
  currentCoach = n;
  welcome.innerText = `سلام ${n} 👋 تیم خودتو انتخاب کن`;
  hideAll(); teamPage.classList.remove('hidden');
  renderSelect();
}

function renderSelect(){
  teamSelect.innerHTML = '<option value="">انتخاب تیم</option>';
  iranLeagueTeams.forEach(t => {
    if(!chosen[t]){
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      teamSelect.appendChild(o);
    }
  });
}

window.chooseTeam = async () => {
  if(!teamSelect.value) return alert('انتخاب کن');
  await setDoc(doc(db, "teams", teamSelect.value), {
    by:'coach',
    label:'قفل شده توسط مربی',
    coachName: currentCoach
  });
  hideAll(); authPage.classList.remove('hidden');
}

function renderList(){
  chosenList.innerHTML = '';
  Object.keys(chosen).forEach(team => {
    const v = chosen[team];
    const d = document.createElement('div');
    d.className = 'team';
    const b = v.by==='coach' ? '<small class="badge">مربی</small>' : '<small class="badge">ادمین</small>';
    d.innerHTML = `${b} <b>${team}</b> ➜ ${v.label}${v.coachName ? ' | مربی: '+v.coachName : ''}${v.name ? ' | '+v.name : ''}`;
    chosenList.appendChild(d);
  });
}

window.adminLogin = () => {
  if(adminPass.value !== ADMIN_PASSWORD) return alert('رمز غلط');
  adminPanel.classList.remove('hidden');
  adminPanel.innerHTML = '<h4>مدیریت تیم‌ها</h4>';
  iranLeagueTeams.forEach(t => {
    const w = document.createElement('div');
    w.className = 'team';
    w.innerHTML = `<b>${t}</b>`;
    const r = document.createElement('div');
    r.className = 'row';
    r.append(btn('رزرو به نام','gray',()=>reserveByName(t)));
    r.append(btn('آزاد','green',()=>unlock(t)));
    w.appendChild(r); adminPanel.appendChild(w);
  });
}

function btn(t,c,f){
  const b = document.createElement('button');
  b.textContent = t; b.className = c; b.onclick = f; return b;
}

async function reserveByName(t){
  const name = prompt('رزرو به نام چه کسی؟');
  if(!name) return;
  await setDoc(doc(db,"teams",t),{by:'admin',label:'رزرو شده',name});
}

async function unlock(t){
  await deleteDoc(doc(db,"teams",t));
}

/* Realtime */
onSnapshot(collection(db,"teams"), snap => {
  chosen = {};
  snap.forEach(d => chosen[d.id] = d.data());
  renderList(); renderSelect();
});
</script>

</body>
</html>
